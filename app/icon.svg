<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shimpliRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="50%" stop-color="#FF2E38" />
      <stop offset="100%" stop-color="#B81D24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#E50914" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark tile -->
  <rect width="512" height="512" rx="128" fill="#0F0F12" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="6" />

  <!-- Shimpli S Emblem -->
  <g filter="url(#glow)">
    <!-- S Curve -->
    <path d="M340 160 C340 120, 180 120, 180 200 C180 280, 332 240, 332 320 C332 400, 160 400, 160 350" 
          fill="none" 
          stroke="url(#shimpliRed)" 
          stroke-width="64" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Play Dot -->
    <circle cx="340" cy="350" r="28" fill="#FFFFFF" />
  </g>
</svg>
