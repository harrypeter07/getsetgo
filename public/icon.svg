<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B81D24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#E50914" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark rounded tile background -->
  <rect width="512" height="512" rx="128" fill="#0F0F12" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="6" />

  <!-- Play Emblem with Red Gradient -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="180" fill="url(#redGrad)" />
    <!-- White Play Triangle -->
    <path d="M212 164 L340 256 L212 348 Z" fill="#FFFFFF" />
  </g>
</svg>
